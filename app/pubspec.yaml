name: recrutador
description: App de Vagas Globais — vagas remotas do Brasil e com patrocínio de visto.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  file_picker: ^13.1.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
