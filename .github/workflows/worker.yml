name: Worker de vagas

# Sem horário fixo: roda quando o app é aberto (pedido em search_requests, no máximo 1 a cada 3 horas)
# ou manualmente pela aba Actions. Quem dispara é o banco (pg_net) ou o workflow "Analisar currículos".
on:
  workflow_dispatch: {}

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Em caso de falha, as últimas linhas viram anotações (o GitHub mascara os secrets automaticamente)
      - name: Rodar o worker
        run: |
          set -o pipefail
          python -m recrutador.main 2>&1 | tee out.txt || {
            tail -n 8 out.txt | sed 's/^/::error::/'
            exit 1
          }
          # Resumo enxuto (o GitHub mostra no máximo 10 anotações de cada tipo por etapa)
          echo "::notice::Fontes: $(grep -oE 'sources.base: [a-z]+: [0-9]+' out.txt | sed 's/sources.base: //; s/: /=/' | paste -sd ' ' -)"
          grep -E "recrutador: " out.txt | sed -E 's/^.*recrutador: //' | sed 's/^/::notice::/' || true
          grep -E " WARNING " out.txt | sed -E 's/^.* WARNING //' | head -n 10 | sed 's/^/::warning::/' || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TRIAGE_MODEL: claude-haiku-5-5
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: br,gb,nl,de,us,ca
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          # Opcional, uso pessoal: LinkedIn/Indeed/Glassdoor via Apify (só roda se o secret existir).
          # Aceita secret ou variável; APIFY_MAX_RESULTS é o total por rodada (1/4 Brasil, 3/4 remotas no exterior)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR || vars.APIFY_ACTOR }}
          APIFY_MAX_RESULTS: ${{ secrets.APIFY_MAX_RESULTS || vars.APIFY_MAX_RESULTS }}
          APIFY_BR_RESULTS: ${{ secrets.APIFY_BR_RESULTS || vars.APIFY_BR_RESULTS }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
