name: Worker de vagas

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas (UTC), fora do minuto 0 para evitar fila
  workflow_dispatch: {}       # permite rodar manualmente pela aba Actions

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Em caso de falha, as últimas linhas viram anotações (o GitHub mascara os secrets automaticamente)
      - name: Rodar o worker
        run: |
          set -o pipefail
          python -m recrutador.main 2>&1 | tee out.txt || {
            tail -n 8 out.txt | sed 's/^/::error::/'
            exit 1
          }
          grep -E "vagas|nenhum usuário" out.txt | sed 's/^/::notice::/' || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TRIAGE_MODEL: claude-haiku-5-5
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          ADZUNA_COUNTRIES: gb,nl,de,us,ca
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
