name: Analisar currículos

# Verifica a cada 15 minutos se alguém enviou currículo ou cover letter pelo app, e se o app
# pediu uma busca de vagas que o banco não conseguiu disparar na hora. Sem nada novo, termina em segundos.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Rodar o autoteste (currículo fictício, não grava no banco)"
        type: boolean
        default: false

concurrency:
  group: documents
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # disparar o worker de vagas pedido pelo app

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - run: pip install -e .
      - name: Analisar documentos
        run: |
          set -o pipefail
          if [ "${{ inputs.selftest }}" = "true" ]; then MOD=recrutador.selftest; else MOD=recrutador.documents; fi
          python -m $MOD 2>&1 | tee out.txt || { tail -n 8 out.txt | sed 's/^/::error::/'; exit 1; }
          grep -E "documents: |selftest[: ]" out.txt | sed -E 's/^.*(documents|selftest): //' | sed 's/^/::notice::/' || true
          grep -E " WARNING " out.txt | sed -E 's/^.* WARNING //' | head -n 10 | sed 's/^/::warning::/' || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Busca pedida pelo app
        id: pending
        if: ${{ inputs.selftest != true }}
        run: python -m recrutador.pending_search >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Disparar o worker de vagas
        if: ${{ steps.pending.outputs.dispatch == 'true' }}
        run: gh workflow run worker.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
