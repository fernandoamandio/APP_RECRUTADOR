name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Converte cada problema do analyzer em anotação, para aparecer no resumo da execução
      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --format=machine > analyze.txt 2>&1
          status=$?
          awk -F'|' 'NF>=8 {lvl=tolower($1); if (lvl=="info") lvl="notice"; printf "::%s file=app/%s,line=%s,col=%s::%s (%s)\n", lvl, substr($4, index($4,"lib/")), $5, $6, $8, $3}' analyze.txt
          grep -v '|' analyze.txt || true
          exit $status
