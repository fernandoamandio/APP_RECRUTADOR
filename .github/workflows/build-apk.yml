name: Gerar APK (Android)

# Só roda manualmente, pela aba Actions ("Run workflow"): você decide quando gerar um APK novo.
on:
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O repositório guarda só o código Dart; a pasta android/ é gerada aqui
      - name: Gerar projeto Android
        run: |
          flutter create . --platforms=android --project-name recrutador --org io.recrutador
          rm -f test/widget_test.dart
          # O template só libera internet nos builds de debug; o release também precisa
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          # Nome que aparece embaixo do ícone
          sed -i 's#android:label="recrutador"#android:label="C4Y Jobs"#' "$manifest"
          # Identidade Coders4You: ícone "4_" (adaptativo), ícone de notificação e tela de abertura
          cp -r branding/android/res/. android/app/src/main/res/
          # Notificações locais exigem "core library desugaring" (flutter_local_notifications)
          gradle=android/app/build.gradle.kts
          sed -i 's#compileOptions {#compileOptions {\n        isCoreLibraryDesugaringEnabled = true#' "$gradle"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$gradle"
          grep -n "Desugaring\|desugar" "$gradle" | sed 's/^/::notice::gradle /'

      - run: flutter pub get

      - name: Compilar APK
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL ausente"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Secret SUPABASE_PUBLISHABLE_KEY ausente"; exit 1; }
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" 2>&1 | tee build.txt || {
            # Publica as linhas relevantes do erro como anotações
            grep -iE "error|exception|what went wrong|failed|could not|requires|incompatible" -A2 build.txt \
              | grep -v '^--$' | head -n 45 | sed 's/^/::error::/'
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk c4y-jobs.apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Confere se o APK é instalável: assinatura, versões do Android e tamanho
      - name: Verificar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs c4y-jobs.apk 2>&1 | grep -E "Verified|Signer #1 certificate DN|ERROR|WARNING" | head -6 | sed 's/^/::notice::/'
          "$BT/aapt2" dump badging c4y-jobs.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" | sed 's/^/::notice::/'
          echo "::notice::tamanho $(stat -c %s c4y-jobs.apk) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: c4y-jobs-apk
          path: app/c4y-jobs.apk
          retention-days: 14
