name: Gerar APK (Android)

# Roda manualmente pela aba Actions ("Run workflow") ou quando o app muda.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # O repositório guarda só o código Dart; a pasta android/ é gerada aqui
      - name: Gerar projeto Android
        run: |
          flutter create . --platforms=android --project-name recrutador --org io.recrutador
          rm -f test/widget_test.dart
          # O template só libera internet nos builds de debug; o release também precisa
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          # Nome que aparece embaixo do ícone
          sed -i 's#android:label="recrutador"#android:label="Vagas Globais"#' "$manifest"

      - run: flutter pub get

      - name: Compilar APK
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Secret SUPABASE_URL ausente"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Secret SUPABASE_PUBLISHABLE_KEY ausente"; exit 1; }
          set -o pipefail
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" 2>&1 | tee build.txt || {
            # Publica as linhas relevantes do erro como anotações
            grep -iE "error|exception|what went wrong|failed|could not|requires|incompatible" -A2 build.txt \
              | grep -v '^--$' | head -n 45 | sed 's/^/::error::/'
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk vagas-globais.apk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      # Confere se o APK é instalável: assinatura, versões do Android e tamanho
      - name: Verificar APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs vagas-globais.apk 2>&1 | grep -E "Verified|Signer #1 certificate DN|ERROR|WARNING" | head -6 | sed 's/^/::notice::/'
          "$BT/aapt2" dump badging vagas-globais.apk | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" | sed 's/^/::notice::/'
          echo "::notice::tamanho $(stat -c %s vagas-globais.apk) bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: vagas-globais-apk
          path: app/vagas-globais.apk
          retention-days: 14
